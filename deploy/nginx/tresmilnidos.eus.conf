# tresmilnidos.eus — «Tres mil nidos al año» (web estática)
# Mismo patrón que observatoribicivlc.org en ionos-03: Cloudflare con proxy delante (SSL «Full (strict)»),
# certificado de Let's Encrypt (certbot certonly --nginx, sin instalador), IP real con cloudflare-real-ip.conf,
# gzip_static (los .gz los genera scripts/web_comprimir.py). Sin IPv6 pública: sin `listen [::]`.
# Dominios secundarios (avispabizkaia.eus y avispa-asiatica-bizkaia.eus): 301 al principal.

# HTTP: reto de ACME y todo lo demás a https del dominio principal
server {
    listen 80;
    server_name tresmilnidos.eus www.tresmilnidos.eus avispabizkaia.eus www.avispabizkaia.eus avispa-asiatica-bizkaia.eus www.avispa-asiatica-bizkaia.eus;
    root /var/www/tresmilnidos.eus;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    location ^~ /.well-known/acme-challenge/ { default_type text/plain; }
    location / { return 301 https://tresmilnidos.eus$request_uri; }
}

# HTTPS: www y dominios secundarios → principal
server {
    listen 443 ssl http2;
    server_name www.tresmilnidos.eus avispabizkaia.eus www.avispabizkaia.eus avispa-asiatica-bizkaia.eus www.avispa-asiatica-bizkaia.eus;
    ssl_certificate     /etc/letsencrypt/live/tresmilnidos.eus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tresmilnidos.eus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://tresmilnidos.eus$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tresmilnidos.eus;
    root /var/www/tresmilnidos.eus;
    index index.html;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    ssl_certificate     /etc/letsencrypt/live/tresmilnidos.eus/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tresmilnidos.eus/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    gzip_static on;
    gzip_vary   on;
    types { application/manifest+json webmanifest; application/vnd.pmtiles pmtiles; image/avif avif; }

    # Contraseña hasta el día de presentar (se quita borrando estas dos líneas y recargando nginx)
    auth_basic           "Tres mil nidos al año (vista previa)";
    auth_basic_user_file /etc/nginx/tresmilnidos.htpasswd;

    # Umami (estadísticas sin cookies) en estadisticas.observatoribicivlc.org
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://estadisticas.observatoribicivlc.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://estadisticas.observatoribicivlc.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    add_header Strict-Transport-Security "max-age=31536000"                         always;
    add_header X-Content-Type-Options    "nosniff"                                  always;
    add_header X-Frame-Options           "DENY"                                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp                                       always;

    location ^~ /.well-known/acme-challenge/ { auth_basic off; default_type text/plain; try_files $uri =404; }
    location ~ /\. { return 404; }

    # HTML: siempre fresco
    location ~* \.html$ {
        add_header Cache-Control             "no-cache"                                 always;
        add_header Strict-Transport-Security "max-age=31536000"                         always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header X-Frame-Options           "DENY"                                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   $csp                                       always;
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control             "no-cache"                                 always;
        add_header Strict-Transport-Security "max-age=31536000"                         always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header X-Frame-Options           "DENY"                                     always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   $csp                                       always;
        try_files /index.html =404;
    }
    # Librerías y fuentes con versión fija; imágenes: caché larga
    location ^~ /vendor/ {
        add_header Cache-Control          "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff"                 always;
        try_files $uri =404;
    }
    location ~* \.(avif|webp|png|jpg|svg|ico|woff2)$ {
        add_header Cache-Control          "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff"                always;
        try_files $uri =404;
    }
    # Datos y código propio: una hora (la web está congelada, pero así un arreglo se ve pronto)
    location ~* \.(js|css|json|geojson|csv|webmanifest|pdf)$ {
        add_header Cache-Control               "public, max-age=3600" always;
        add_header X-Content-Type-Options      "nosniff"              always;
        add_header Access-Control-Allow-Origin "*"                    always;
        try_files $uri =404;
    }
    # Mapa base (PMTiles): peticiones por rangos
    location ~* \.pmtiles$ {
        add_header Cache-Control               "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*"                      always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
